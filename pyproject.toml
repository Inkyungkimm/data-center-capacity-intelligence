[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-center-capacity-intelligence"
version = "0.1.0"
description = "Public Azure VM capacity analytics pipeline with Python, PostgreSQL, dbt, and Streamlit"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
