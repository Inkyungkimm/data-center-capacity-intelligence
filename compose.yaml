services:
  postgres:
    image: postgres:16-alpine
    container_name: dc_capacity_postgres
    environment:
      POSTGRES_USER: ${PGUSER:-analytics}
      POSTGRES_PASSWORD: ${PGPASSWORD:-analytics_local_only}
      POSTGRES_DB: ${PGDATABASE:-capacity}
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - capacity_pgdata:/var/lib/postgresql/data
volumes:
  capacity_pgdata:
